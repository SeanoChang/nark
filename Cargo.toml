[workspace]
members = [".", "bench"]
resolver = "2"

[package]
name = "nark"
version = "0.13.0"
edition = "2024"

[lib]
name = "nark"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.101"
blake3 = "1.8.3"
chrono = "0.4.43"
# Read-only registry connection pool for `nark serve` (Phase 3.5). We do NOT use
# deadpool-sqlite: its built-in Manager hardcodes `Connection::open()` =
# READ_WRITE|CREATE with no OpenFlags hook (verified deadpool-sqlite 0.13.0),
# which would violate serve's read-only guarantee. Instead we pair deadpool's
# generic managed pool with deadpool-sync's `SyncWrapper` and a custom
# read-only `Manager` (see `src/serve/dpool.rs`). `rt_tokio_1` wires the
# `Runtime::Tokio1` used to run blocking SQLite on a managed thread.
deadpool = { version = "0.13", features = ["managed", "rt_tokio_1"] }
deadpool-sync = "0.2"
regex = "1"
clap = { version = "4.5.60", features = ["derive"] }
dirs = "6.0.0"
flate2 = "1"
include_dir = "0.7.4"
indicatif = "0.17"
# Both "user" AND "socket" are required for getpeereid on macOS: nix gates
# getpeereid on `all(feature = "socket", feature = "user")` (verified against
# nix-0.31.3). Do not trim either feature or peer-uid extraction breaks.
nix = { version = "0.31.3", features = ["user", "socket"] }
ndarray = "0.16"
ort = { version = "2.0.0-rc.11", features = ["load-dynamic"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
rusqlite_migration = { version = "2.4.1", features = ["from-directory"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
similar = "2"
sha2 = "0.10"
tar = "0.4"
tokenizers = "0.20"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time"] }
ureq = "2"
uuid = { version = "1.21.0", features = ["v4"] }
toml = "0.8"
walkdir = "2.5.0"
